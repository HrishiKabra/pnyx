[project]
name = "pnyx"
version = "0.1.0"
description = "LMSR prediction-market experiment harness for LLM agents"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "numpy",
    "pandas",
    "pyyaml",
    "httpx",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
replay = [
    "streamlit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pnyx"]
